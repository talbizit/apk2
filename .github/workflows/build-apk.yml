name: Build Android APK

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk2-sms
        path: app/build/outputs/apk/release/apk2-sms.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/claude/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: SMS Receiver v1.0.${{ github.run_number }}
        body: |
          ## SMS Receiver for Android

          📱 Automatic build for Samsung S25 and other Android devices

          ### Installation Instructions:
          1. Download the APK file below
          2. Transfer to your Samsung S25
          3. Enable "Install unknown apps" in Settings → Security
          4. Tap the APK file to install
          5. Grant SMS permissions when prompted

          ### Features:
          - ✅ Receive and display all SMS messages
          - ✅ Store last 100 messages locally
          - ✅ Material Design UI
          - ✅ Clear messages functionality
          - ✅ Runtime permissions handling
          - ✅ Compatible with Android 7.0+
        files: app/build/outputs/apk/release/apk2-sms.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
